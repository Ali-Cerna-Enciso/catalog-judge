[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-judge"
version = "0.1.0"
description = "Harness local: política de demanda retail en código y triage de tickets con Jev"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali Yury Cerna Enciso"}]
keywords = ["jev", "typesafe", "retail", "triage", "streamlit"]
dependencies = [
  "typesafe-sdk==0.7.1",
  "pandas>=2.0,<3.0",
  "streamlit>=1.49,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[project.scripts]
catalog-judge = "catalog_judge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = [".venv", "opencode_test", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["catalog_judge"]
mypy_path = "src"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
ignore_missing_imports = true
