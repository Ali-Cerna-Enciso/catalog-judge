<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="F1 de ruta en cuatro mediciones">
  <rect width="720" height="280" fill="#f7f6f3"/>
  <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d2a32">F1 de la ruta (aceptar vs revisar)</text>
  <text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b73">50 tickets por medición, un solo live, sin retocar el corte después de ver el número</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d2a32">
    <text x="24" y="96">Gold y reglas no coincidían</text>
    <rect x="250" y="80" width="220" height="22" rx="4" fill="#c4c0b8"/>
    <text x="478" y="96" font-weight="700">0.55</text>
    <text x="24" y="136">Misma rúbrica para etiquetar y preguntar</text>
    <rect x="250" y="120" width="288" height="22" rx="4" fill="#4a7c82"/>
    <text x="546" y="136" font-weight="700">0.72</text>
    <text x="24" y="176">Tres señales de humano (revisó de más)</text>
    <rect x="250" y="160" width="252" height="22" rx="4" fill="#c47b4a"/>
    <text x="510" y="176" font-weight="700">0.63</text>
    <text x="24" y="216">Listón más alto para ambigüedad</text>
    <rect x="250" y="200" width="328" height="22" rx="4" fill="#1f6f4a"/>
    <text x="586" y="216" font-weight="700">0.82</text>
  </g>
  <text x="24" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b73">Escala 01. La barra verde es la medición actual.</text>
</svg>
